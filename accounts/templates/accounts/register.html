{% extends "accounts/base.html" %}
{% block content %}
<h2>Customer Registration</h2>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <label for="name">Name</label>
    <input id="name" type="text" name="name" value="{{ name }}" maxlength="150" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email }}" maxlength="150" autocomplete="email" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Customer Registration</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Customer Login</a></p>
{% endblock %}
